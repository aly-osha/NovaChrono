{% extends "base.html" %}
{% block title %}{{ title }} — NovaChrono{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-space-2xl">
  <div class="flex items-center justify-between mb-space-xl">
    <h1 class="font-display text-2xl font-bold text-on-surface">{{ title }}</h1>
    <a href="{% url 'address_list' %}" class="text-on-surface-variant hover:text-primary font-mono text-sm transition-colors">← Addresses</a>
  </div>

  <div class="bg-surface-container rounded-xl p-space-lg border border-surface-container-high">
    <form method="post" class="space-y-space-md">
      {% csrf_token %}
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-space-md">
        <div>
          <label class="font-mono text-[11px] uppercase tracking-widest text-outline block mb-space-2xs">Street Address *</label>
          <input type="text" name="line1" value="{{ form.line1.value|default:'' }}" class="w-full px-space-md py-space-sm rounded-lg bg-surface-container-high border border-surface-container-high text-on-surface font-body text-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed/30 transition-all" placeholder="123 Collector Lane"/>
        </div>
        <div>
          <label class="font-mono text-[11px] uppercase tracking-widest text-outline block mb-space-2xs">Apartment / Suite</label>
          <input type="text" name="line2" value="{{ form.line2.value|default:'' }}" class="w-full px-space-md py-space-sm rounded-lg bg-surface-container-high border border-surface-container-high text-on-surface font-body text-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed/30 transition-all" placeholder="Suite 4B"/>
        </div>
        <div>
          <label class="font-mono text-[11px] uppercase tracking-widest text-outline block mb-space-2xs">City *</label>
          <input type="text" name="city" value="{{ form.city.value|default:'' }}" class="w-full px-space-md py-space-sm rounded-lg bg-surface-container-high border border-surface-container-high text-on-surface font-body text-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed/30 transition-all" placeholder="Mumbai"/>
        </div>
        <div>
          <label class="font-mono text-[11px] uppercase tracking-widest text-outline block mb-space-2xs">State *</label>
          <input type="text" name="state" value="{{ form.state.value|default:'' }}" class="w-full px-space-md py-space-sm rounded-lg bg-surface-container-high border border-surface-container-high text-on-surface font-body text-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed/30 transition-all" placeholder="Maharashtra"/>
        </div>
        <div>
          <label class="font-mono text-[11px] uppercase tracking-widest text-outline block mb-space-2xs">Postal Code *</label>
          <input type="text" name="postal_code" value="{{ form.postal_code.value|default:'' }}" class="w-full px-space-md py-space-sm rounded-lg bg-surface-container-high border border-surface-container-high text-on-surface font-body text-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed/30 transition-all" placeholder="400001"/>
        </div>
        <div>
          <label class="font-mono text-[11px] uppercase tracking-widest text-outline block mb-space-2xs">Country</label>
          <input type="text" name="country" value="{{ form.country.value|default:'India' }}" class="w-full px-space-md py-space-sm rounded-lg bg-surface-container-high border border-surface-container-high text-on-surface font-body text-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed/30 transition-all"/>
        </div>
      </div>
      <div class="flex items-center gap-space-md pt-space-md border-t border-surface-container-high">
        <label class="flex items-center gap-space-xs cursor-pointer">
          <input type="checkbox" name="is_default" {% if form.is_default.value %}checked{% endif %} class="w-4 h-4 rounded bg-surface-container-highest accent-primary"/>
          <span class="font-mono text-sm text-on-surface-variant">Set as default address</span>
        </label>
      </div>
      <div class="flex gap-space-md pt-space-md">
        <button type="submit" class="flex-1 py-space-sm rounded-lg bg-primary-container text-on-primary font-mono text-sm font-semibold hover:bg-primary hover:text-on-primary-fixed transition-colors">
          {% if title == 'Add Address' %}SAVE ADDRESS{% else %}UPDATE ADDRESS{% endif %}
        </button>
        <a href="{% url 'address_list' %}" class="px-space-lg py-space-sm rounded-lg bg-surface-container-high text-on-surface-variant font-mono text-sm hover:bg-surface-container transition-colors">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
