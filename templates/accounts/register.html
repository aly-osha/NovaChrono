{% extends "base.html" %}
{% block title %}Register — NovaChrono{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-space-3xl">
  <div class="text-center mb-space-2xl">
    <a href="{% url 'home' %}" class="flex items-center gap-space-sm mb-space-lg">
      <span class="font-display text-xl font-extrabold tracking-wider text-on-surface uppercase">NOVACHRONO</span>
    </a>
    <h1 class="font-display text-3xl font-bold text-on-surface">JOIN THE VAULT</h1>
    <p class="text-on-surface-variant text-sm mt-space-sm">Create your collector account</p>
  </div>

  <div class="bg-surface-container rounded-xl p-space-xl shadow-xl border border-surface-container-high">
    <form method="post" class="space-y-space-md">
      {% csrf_token %}
      <div>
        <label class="font-mono text-[11px] uppercase tracking-widest text-outline block mb-space-2xs">Full Name</label>
        <input type="text" name="name" class="w-full px-space-md py-space-sm rounded-lg bg-surface-container-high border border-surface-container-high text-on-surface font-body text-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed/30 transition-all" placeholder="Alex Rivera" required/>
      </div>
      <div>
        <label class="font-mono text-[11px] uppercase tracking-widest text-outline block mb-space-2xs">Email</label>
        <input type="email" name="email" class="w-full px-space-md py-space-sm rounded-lg bg-surface-container-high border border-surface-container-high text-on-surface font-body text-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed/30 transition-all" placeholder="collector@example.com" required/>
      </div>
      <div>
        <label class="font-mono text-[11px] uppercase tracking-widest text-outline block mb-space-2xs">Phone (optional)</label>
        <input type="tel" name="phone" class="w-full px-space-md py-space-sm rounded-lg bg-surface-container-high border border-surface-container-high text-on-surface font-body text-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed/30 transition-all" placeholder="+91 98765 43210" />
      </div>
      <div>
        <label class="font-mono text-[11px] uppercase tracking-widest text-outline block mb-space-2xs">Password</label>
        <input type="password" name="password1" class="w-full px-space-md py-space-sm rounded-lg bg-surface-container-high border border-surface-container-high text-on-surface font-body text-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed/30 transition-all" placeholder="Min 8 characters" required/>
      </div>
      <div>
        <label class="font-mono text-[11px] uppercase tracking-widest text-outline block mb-space-2xs">Confirm Password</label>
        <input type="password" name="password2" class="w-full px-space-md py-space-sm rounded-lg bg-surface-container-high border border-surface-container-high text-on-surface font-body text-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed/30 transition-all" placeholder="Repeat password" required/>
      </div>
      <button type="submit" class="w-full py-space-sm rounded-lg bg-primary-container text-on-primary font-mono text-sm font-semibold hover:bg-primary hover:text-on-primary-fixed transition-colors flex items-center justify-center gap-space-xs">
        <span class="material-symbols-outlined">person_add</span>
        CREATE ACCOUNT
      </button>
      <p class="text-center text-on-surface-variant text-xs">
        Already have an account? <a href="{% url 'login' %}" class="text-primary hover:underline">Sign in</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
